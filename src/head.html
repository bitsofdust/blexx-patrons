<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLEXX · Patrons</title>
<meta name="description" content="Mint a winged Patron from the three Houses of BLEXX — Chance, Manifestation, Devotion.">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap');
:root{
  --onyx:#131112;--panel:rgba(24,22,21,.72);--panel-border:rgba(255,255,255,.08);
  --cream:#f6f3ec;--text:#f2efe9;--text-dim:#948f87;
  --accent:#c9a86a;--accent-glow:rgba(201,168,106,.4);
  --r-lg:24px;--r-md:14px;--r-pill:999px;
}
body.house-chance{--accent:#ED2024;--accent-glow:rgba(237,32,36,.4);}
body.house-manifestation{--accent:#405EAB;--accent-glow:rgba(64,94,171,.4);}
body.house-devotion{--accent:#882782;--accent-glow:rgba(136,39,130,.4);}
*{box-sizing:border-box}
body{margin:0;background:var(--onyx);color:var(--text);font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5;position:relative;overflow-x:hidden;min-height:100vh}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% -12%,var(--accent-glow),transparent 62%);opacity:.55;transition:background .6s ease}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:36px 20px 64px}

.top-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:12px;flex-wrap:wrap}
.brand-lockup{display:flex;align-items:center;gap:10px}
.brand-crown{height:20px;width:auto;flex-shrink:0}
.brand-sub{font-size:11px;letter-spacing:.28em;color:var(--text-dim);font-weight:700;text-transform:uppercase;padding-left:10px;border-left:1px solid var(--panel-border)}
.hud-status{display:flex;align-items:center;gap:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulseDot 1.6s infinite}
.status-dot.sealed{animation:none;box-shadow:0 0 10px var(--accent)}
@keyframes pulseDot{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}

.tagline{font-size:13px;color:var(--text-dim);line-height:1.6;margin:14px 0 22px;text-align:center;white-space:nowrap}

.panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-lg);padding:18px 20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin:0 0 16px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.ctl-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center;margin:0 0 12px}
.ctl-row:last-child{margin-bottom:0}
.ctl-lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-right:2px;font-weight:700}

.swatch-row{display:flex;max-width:100%;overflow-x:auto;gap:8px;scrollbar-width:none;padding:2px}
.swatch-row::-webkit-scrollbar{display:none}
.swatch{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1.5px solid var(--panel-border);border-radius:var(--r-pill);padding:6px 14px 6px 6px;color:var(--text-dim);font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s cubic-bezier(.16,1,.3,1);white-space:nowrap}
.swatch:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.swatch.active,.swatch[aria-pressed="true"]{color:var(--text);border-color:var(--sw-color,var(--accent));background:rgba(255,255,255,.06);box-shadow:0 0 14px var(--sw-glow,var(--accent-glow))}
.swatch-chip{display:inline-block;width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--sw-color,var(--text-dim));box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.swatch-chip.all-chip{background:conic-gradient(#ed2024 0deg 120deg,#405eab 120deg 240deg,#882782 240deg 360deg)}
.swatch-chip.relic-chip{background:linear-gradient(135deg,#eceadf,#bdb8a8 40%,#79766a 58%,#d2cdbe 78%,#8c8879)}
.swatch-chip.sigil-chip{background:var(--accent)}

.summon-btn{display:block;width:100%;margin:16px 0 0;padding:17px 24px;background:var(--accent);color:#100f0d;border:none;border-radius:var(--r-pill);font:inherit;font-size:15px;font-weight:700;letter-spacing:.05em;cursor:pointer;box-shadow:0 8px 24px var(--accent-glow);transition:all .18s cubic-bezier(.16,1,.3,1)}
.summon-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px var(--accent-glow)}
.summon-btn:active{transform:translateY(0)}

.ghost-btn{background:transparent;border:1.5px solid var(--panel-border);color:var(--text);font:inherit;font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--r-pill);cursor:pointer;transition:all .18s cubic-bezier(.16,1,.3,1)}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.ghost-btn:active{transform:scale(.97)}
.ghost-btn.small{padding:6px 12px;font-size:11px}

input#seedfield{background:var(--cream);color:#2a2723;border:none;border-radius:var(--r-md);padding:8px 12px;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;width:130px;cursor:text}
input#seedfield:focus{outline:2px solid var(--accent);outline-offset:1px}
#seedhint{font-family:ui-monospace,Menlo,Consolas,monospace}

.showcase{position:relative;display:flex;align-items:center;justify-content:center;gap:36px;padding:32px;background:rgba(4,4,5,.5);border:1px solid var(--panel-border);border-radius:var(--r-lg);box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 30px 60px rgba(0,0,0,.5);transition:box-shadow .5s ease;overflow:hidden}
.showcase.sealing{box-shadow:0 0 44px var(--accent-glow),0 0 0 1px rgba(255,255,255,.03) inset,0 30px 60px rgba(0,0,0,.5)}
.card-back-wrap{position:relative;width:220px;max-width:34%;flex-shrink:0}
.card-back-wrap svg{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
.card-back-mascot{position:absolute;left:50%;top:49%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);-webkit-mask-image:var(--mascot-src);mask-image:var(--mascot-src);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:var(--mascot-color,var(--cream))}

.stage-wrap{position:relative;display:flex;justify-content:center;flex-shrink:0}
#stage{position:relative;z-index:1;width:100%;display:flex;justify-content:center}
#stage svg{display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.stage-flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;mix-blend-mode:screen}
.stage-flash.roll{animation:rollFlash .5s ease-out;background:linear-gradient(180deg,transparent,var(--accent) 45%,transparent)}
.stage-flash.seal{animation:sealFlash .8s ease-out;background:radial-gradient(circle,var(--accent) 0%,transparent 65%)}
@keyframes rollFlash{0%{opacity:0}12%{opacity:.85}45%{opacity:.35}100%{opacity:0}}
@keyframes sealFlash{0%{opacity:0}25%{opacity:.8}100%{opacity:0}}
.pop{animation:cardPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{transform:scale(.9);filter:brightness(1.5) saturate(1.25)}60%{transform:scale(1.035)}100%{transform:scale(1);filter:none}}

.details-toggle{display:block;margin:14px auto 0;background:transparent;border:none;color:var(--text-dim);font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:6px 10px}
.details-toggle:hover{color:var(--text)}
.options-panel{margin-top:8px;padding-top:14px;border-top:1px solid var(--panel-border)}
.options-panel[hidden]{display:none}
.meta{margin-top:14px;font-size:11.5px;color:var(--text-dim);text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.03em}
.recall-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--panel-border)}

.mint-btn{display:block;width:100%;margin-top:18px;padding:16px 24px;background:var(--cream);color:#17140f;border:none;border-radius:var(--r-pill);font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .18s cubic-bezier(.16,1,.3,1)}
.mint-btn:hover:not(:disabled){background:var(--accent);color:#100f0d;transform:translateY(-2px);box-shadow:0 10px 28px var(--accent-glow)}
.mint-btn:active:not(:disabled){transform:translateY(0)}
.mint-btn:disabled{opacity:.4;cursor:not-allowed}
.mint-btn[hidden]{display:none}
.mint-hint{text-align:center;font-size:11px;color:var(--text-dim);margin-top:8px;min-height:14px}

.registry-section{margin-top:40px}
.section-label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:10px;display:flex;justify-content:center;align-items:baseline;gap:10px}
.feed-container{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.feed-container::-webkit-scrollbar{height:5px}
.feed-container::-webkit-scrollbar-track{background:transparent}
.feed-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.feed-placeholder{flex:1;text-align:center;font-size:11.5px;color:var(--text-dim);padding:30px 0;letter-spacing:.05em}
.feed-card{width:96px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:14px;background:var(--panel);border:1.5px solid var(--fc-accent,var(--panel-border));cursor:pointer;transition:transform .18s,box-shadow .18s}
.feed-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px var(--fc-glow,rgba(0,0,0,.4))}
.feed-thumb{width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#050505}
.feed-thumb svg{width:100%;height:100%;display:block}
.feed-name{font-size:10.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-house{display:flex;align-items:center;gap:4px;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc-accent,var(--text-dim));font-weight:700}
.feed-house-icon{flex-shrink:0}
.feed-time{font-size:8px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text-dim);opacity:.7}

@media (max-width:620px){
  .wrap{padding:24px 14px 48px}
  .top-hud{flex-direction:column;align-items:flex-start;gap:8px}
  .card-back-wrap{display:none}
  .tagline{white-space:normal}
}
</style>
</head>
<body class="house-all">
<div class="bg-glow" id="bgGlow"></div>
<div class="wrap">
  <div class="top-hud">
    <div class="brand-lockup">
      <svg class="brand-crown" viewBox="0 0 1313.53 342.3" fill="var(--cream)"><path d="M255.79,170.78c30.39-8.06,48.11-29.42,53.41-52.09,1.12-4.87,1.67-9.78,1.67-14.61,0-32.29-21.19-79.47-113.2-79.47h-114.47c-28.4,0-49.19,21.23-49.19,53.12v186.91c0,27.54,14.74,46.34,36.32,51.61,4.06,1,8.36,1.52,12.86,1.52h123.79c8.76,0,16.89-.52,24.5-1.52,63.81-8.14,87.86-48.21,87.86-80.5,0-8.5-1.2-16.36-3.62-23.47-7.65-22.35-27.44-37.32-59.94-41.51ZM141.32,122.33h23.74c22.46,0,39.43-.4,39.43,14.89,0,13.17-15.29,14.85-33.93,14.85h-29.23v-29.73ZM211.26,212.29c-2.91,8.46-14.22,12.45-34.33,12.45h-35.61v-33.17h41.54c16.09,0,29.23,6.39,29.23,15.73,0,1.8-.28,3.47-.84,4.99Z"/><path d="M488.03,213.25h-52.57V77.2c0-8.94-1.87-16.96-5.22-23.87-8.84-18.48-27.84-29.26-48.19-29.26-28,0-53.85,20.4-53.85,53.12v187.45c0,27.54,12.03,46.38,37.08,51.61,4.7,1,9.88,1.52,15.49,1.52h107.26c25.85,0,52.14-17,52.14-52.29s-26.29-52.25-52.14-52.25Z"/><path d="M774.37,225.06c-9.72-7.94-22.15-11.81-34.13-11.81h-83.96l.08-11.38s58.03.16,63.09.16c20.79,0,35.65-9.74,35.65-31.85s-15.29-31.01-33.1-31.01c-4.22,0-65.72.52-65.72.52v-10.54h78.03c14.7,0,29.95-5.87,40.07-17.84,7.09-8.42,11.67-19.88,11.67-34.44s-4.58-25.98-11.67-34.41c-10.12-11.97-25.37-17.84-40.07-17.84h-136.1c-28.4,0-49.19,21.23-49.19,53.12v186.91c0,32.73,20.79,53.12,49.19,53.12h142.03c11.99,0,24.42-3.91,34.13-11.81,10.63-8.66,18-22.07,18-40.47s-7.37-31.81-18-40.43Z"/><path d="M1267.13,236.78l-64.32-67.29,62.29-63.63c30.69-31.63,6.96-81.3-40.96-81.3-22.56,0-38.13,15.16-48.36,27.5l-40.16,48.03-41.75-47.63c-11.9-13.53-25.03-27.9-49.59-27.9h-8.85c-.47,0-.91,0-1.38.04-21.84.58-36.93,15.42-46.94,27.46l-40.19,48.03-41.75-47.63c-8.23-9.4-17.09-19.19-29.93-24.27-5.66-2.28-12.12-3.63-19.63-3.63-40.99,0-70.05,46.4-37.73,80.46l57.35,60,5.77,6.06-5.77,5.91-60.18,61.45c-32.39,32.83-4.93,79.19,40.12,79.19,7.29,0,13.89-1.49,20.06-4.39,9.83-4.5,18.65-12.33,27.46-22.67l43.42-51.73,45.06,50.5c10.77,12.26,22.53,25.18,42.88,27.57h.33c3.05.47,6.24.73,9.5.73,18.83,0,33.16-10.27,47.52-27.06l43.39-51.73,45.09,50.5c11.9,13.53,24.96,27.9,49.55,27.9,40.96,0,70.05-46.36,37.69-80.46ZM1106.21,173.15c-34.64,35.33-91.56,35.01-125.77-.8l-2.87-2.97c34.64-35.41,91.6-35.04,125.81.73l2.87,3.01-.04.04Z"/><path d="M1059.99,171.15c0,10.41-8.42,18.86-18.83,18.86s-18.86-8.45-18.86-18.86,8.45-18.9,18.86-18.9,18.83,8.45,18.83,18.9Z"/></svg>
      <span class="brand-sub">Patrons</span>
    </div>
    <div class="hud-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">UNSEALED</span>
    </div>
  </div>
  <p class="tagline">Three Houses, one winged Patron per seed. Summon to preview, choose a finish, then bind it into the Registry.</p>

  <div class="panel">
    <button id="reroll" class="summon-btn">&#8635; SUMMON A PATRON</button>
    <button id="optionsToggle" class="details-toggle">Customize &#8964;</button>
    <div class="options-panel" id="optionsPanel" hidden>
      <div class="ctl-row">
        <span class="ctl-lab">House</span>
        <div class="swatch-row" id="house">
          <button data-v="All" aria-pressed="true" class="swatch active"><span class="swatch-chip all-chip"></span>All</button>
          <button data-v="Chance" class="swatch" style="--sw-color:#ed2024;--sw-glow:rgba(237,32,36,.4)"><span class="swatch-chip" style="background:#ed2024"></span>Chance</button>
          <button data-v="Manifestation" class="swatch" style="--sw-color:#405eab;--sw-glow:rgba(64,94,171,.4)"><span class="swatch-chip" style="background:#405eab"></span>Manifestation</button>
          <button data-v="Devotion" class="swatch" style="--sw-color:#882782;--sw-glow:rgba(136,39,130,.4)"><span class="swatch-chip" style="background:#882782"></span>Devotion</button>
        </div>
      </div>
      <div class="ctl-row">
        <span class="ctl-lab">Finish</span>
        <div class="swatch-row" id="finish">
          <button data-v="sigil" aria-pressed="true" class="swatch active"><span class="swatch-chip sigil-chip"></span>Sigil</button>
          <button data-v="relic" class="swatch" style="--sw-color:#bdb8a8;--sw-glow:rgba(189,184,168,.4)"><span class="swatch-chip relic-chip"></span>Relic</button>
        </div>
      </div>
      <div class="recall-row">
        <span class="ctl-lab">Recall seed</span>
        <input id="seedfield" type="number" inputmode="numeric" min="0">
        <button id="go" class="ghost-btn small">Recall</button>
        <span class="ctl-lab" id="seedhint"></span>
      </div>
    </div>
  </div>

  <div class="showcase" id="showcase">
    <div class="card-back-wrap">
      <svg id="cardBackSvg" viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="card-back-mascot" id="stageMascot"></div>
    </div>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-flash" id="stageFlash"></div>
      <div id="stage"></div>
    </div>
  </div>

  <button id="mintBtn" class="mint-btn" hidden>BIND THIS PATRON</button>
  <p class="mint-hint" id="mintHint"></p>
  <div class="meta" id="meta"></div>

  <section class="registry-section">
    <div class="section-label"><span>The Patron Registry</span><span id="registryCount"></span></div>
    <div class="feed-container" id="feed"><div class="feed-placeholder">No Patrons bound yet — be the first.</div></div>
  </section>
</div>
